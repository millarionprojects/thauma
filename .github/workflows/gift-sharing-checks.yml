name: Gift sharing checks

on:
  push:
    branches: [main, feat/cloudflare-gift-sharing]
  pull_request:
    paths:
      - 'assets/**'
      - 'backend/**'
      - 'index.html'
      - 'open.html'
      - '.github/workflows/gift-sharing-checks.yml'

permissions:
  contents: read

jobs:
  sharing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check backend/worker.mjs
          node --experimental-default-type=module --check assets/gift-api.js
          node --experimental-default-type=module --check assets/experience-CsT7v0Lg.js
          node --experimental-default-type=module --check assets/main-continuous-review.js
          node --experimental-default-type=module --check assets/copy-review.js
          node --experimental-default-type=module --check assets/open-continuous-review.js
          node --experimental-default-type=module --check assets/local-gift-sharing.js
          node --experimental-default-type=module --check assets/microphone-recording.js
          node --experimental-default-type=module --check assets/voice-level.js
          node --experimental-default-type=module --check assets/open-bootstrap.js
          node --experimental-default-type=module --check assets/loading-deadline.js
          node --experimental-default-type=module --check assets/export-audio.js
          node --experimental-default-type=module --check assets/mp4-integrity.js
          node --experimental-default-type=module --check assets/export-integrity.js
      - name: Test creation and independent recipient
        working-directory: backend
        run: npm test
      - name: Install independent media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify video timing and preserved video/audio bytes
        working-directory: backend
        run: |
          ffmpeg -version
          node --test qa/video-export.test.mjs
      - name: Validate Worker bundle
        working-directory: backend
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/thauma-worker
      - name: Install browser verification tools
        working-directory: backend
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify actual UI in independent browser contexts
        working-directory: backend
        run: node qa/browser-flow.mjs
      - name: Verify mobile WebKit loading and recovery
        working-directory: backend
        run: node qa/open-loading.mjs
      - name: Verify native MP4 duration and actual video exports
        working-directory: backend
        run: node qa/video-duration.mjs
      - name: Verify published site and real Cloudflare storage
        if: github.ref == 'refs/heads/main'
        working-directory: backend
        run: node qa/live-flow.mjs
