name: Deploy Thauma gift service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/worker.mjs'
      - 'backend/wrangler.jsonc'
      - '.github/workflows/deploy-gift-service.yml'

permissions:
  contents: read

concurrency:
  group: thauma-gift-service-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check gift service before deployment
        working-directory: backend
        run: npm test
      - name: Prepare Workers address and gift retention
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          assert.match(account || '', /^[a-f0-9]{32}$/i, 'CLOUDFLARE_ACCOUNT_ID must be the 32-character account identifier');
          assert.ok(token, 'Missing CLOUDFLARE_API_TOKEN');
          const root = 'https://api.cloudflare.com/client/v4/accounts/' + account;
          async function api(path, method = 'GET', body) {
            const response = await fetch(root + path, {
              method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}), signal: AbortSignal.timeout(30000)
            });
            const json = await response.json();
            return { ok: response.ok && json.success === true, status: response.status, result: json.result, codes: json.errors?.map(item => item.code).join(',') };
          }
          let current = await api('/workers/subdomain');
          if (!current.ok && current.status !== 404) throw new Error('Cannot read Workers address; Cloudflare codes: ' + current.codes);
          if (!current.result?.subdomain) {
            const proposed = 'thauma-millarionprojects';
            let created = await api('/workers/subdomain', 'PUT', { subdomain: proposed });
            if (!created.ok && [400, 409].includes(created.status)) {
              created = await api('/workers/subdomain', 'PUT', { subdomain: proposed + '-' + crypto.randomUUID().slice(0, 8) });
            }
            if (!created.ok) throw new Error('Cannot register Workers address; Cloudflare codes: ' + created.codes);
            current = created;
          }
          console.log('Workers address ready: ' + current.result.subdomain + '.workers.dev');
          const config = JSON.parse(await readFile('backend/wrangler.jsonc', 'utf8'));
          const bucket = config.r2_buckets.find(item => item.binding === 'GIFTS').bucket_name;
          const lifetime = Number(config.vars.GIFT_TTL_DAYS || 30);
          assert.ok(Number.isInteger(lifetime) && lifetime >= 1 && lifetime <= 365, 'Invalid gift lifetime');
          const buckets = await api('/r2/buckets');
          if (!buckets.ok) throw new Error('Cannot access R2 bucket list; Cloudflare codes: ' + buckets.codes);
          if (!buckets.result?.buckets?.some(item => item.name === bucket)) {
            const created = await api('/r2/buckets', 'POST', { name: bucket });
            if (!created.ok) throw new Error('Cannot prepare gift bucket; Cloudflare codes: ' + created.codes);
            console.log('Created expected gift bucket: ' + bucket);
          }
          console.log('Gift bucket ready: ' + bucket);
          const path = '/r2/buckets/' + encodeURIComponent(bucket) + '/lifecycle';
          const existing = await api(path);
          if (!existing.ok && existing.status !== 404) throw new Error('Cannot read gift retention settings; Cloudflare codes: ' + existing.codes);
          const rules = existing.result?.rules || [];
          const maxAge = (lifetime + 1) * 86400;
          const retention = { id: 'thauma-expired-gifts', enabled: true, conditions: { prefix: 'gifts/' }, deleteObjectsTransition: { condition: { type: 'Age', maxAge } } };
          const stored = rules.find(rule => rule.id === retention.id);
          if (JSON.stringify(stored) !== JSON.stringify(retention)) {
            const changed = await api(path, 'PUT', { rules: [...rules.filter(rule => rule.id !== retention.id), retention] });
            if (!changed.ok) throw new Error('Cannot set gift retention; Cloudflare codes: ' + changed.codes);
          }
          const verified = await api(path);
          assert.ok(verified.ok && verified.result.rules.some(rule => rule.id === retention.id && rule.enabled && rule.conditions.prefix === 'gifts/' && rule.deleteObjectsTransition?.condition.maxAge === maxAge), 'Gift retention was not saved');
          console.log('PASS: expired gifts are removed after ' + (lifetime + 1) + ' days');
          JS
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          wranglerVersion: '4'
          command: deploy
      - name: Verify published gift service
        env:
          THAUMA_API_BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = process.env.THAUMA_API_BASE?.replace(/\/$/, '');
          assert.ok(base && /^https:\/\/[^/]+\.workers\.dev$/.test(base), 'Missing Worker origin');
          const origin = 'https://millarionprojects.github.io';
          const headers = { Origin: origin };
          const get = path => fetch(base + path, { headers, signal: AbortSignal.timeout(30000) });
          const configResponse = await get('/api/config');
          assert.equal(configResponse.status, 200, 'Worker configuration unavailable');
          const config = await configResponse.json();
          assert.equal(config.publicSharing, true);
          assert.equal(config.audioSharing, true);
          assert.equal(configResponse.headers.get('access-control-allow-origin'), origin);
          const certificate = new Blob(['%PDF-1.4\nThauma connection check'], { type: 'application/pdf' });
          const wav = Buffer.alloc(44 + 3200);
          wav.write('RIFF', 0); wav.writeUInt32LE(wav.length - 8, 4); wav.write('WAVEfmt ', 8);
          wav.writeUInt32LE(16, 16); wav.writeUInt16LE(1, 20); wav.writeUInt16LE(1, 22);
          wav.writeUInt32LE(16000, 24); wav.writeUInt32LE(32000, 28);
          wav.writeUInt16LE(2, 32); wav.writeUInt16LE(16, 34);
          wav.write('data', 36); wav.writeUInt32LE(3200, 40);
          const audio = new Blob([wav], { type: 'audio/wav' });
          const form = new FormData();
          form.set('metadata', JSON.stringify({ title: 'Thauma connection check', amount: '', message: 'Automatic service check', design: 'envelope-copper', lang: 'ru', theme: 'light' }));
          form.set('file', certificate, 'check.pdf'); form.set('audio', audio, 'check.wav');
          const response = await fetch(base + '/api/gifts', { method: 'POST', headers, body: form, signal: AbortSignal.timeout(120000) });
          assert.equal(response.status, 201, 'Gift upload failed');
          const saved = await response.json();
          assert.match(saved.id, /^[a-f0-9]{64}$/);
          const metadataResponse = await get('/api/gifts/' + saved.id);
          assert.equal(metadataResponse.status, 200);
          const metadata = await metadataResponse.json();
          assert.equal(metadata.file.size, certificate.size); assert.equal(metadata.audio.size, audio.size);
          for (const [key, original] of [['file', certificate], ['audio', audio]]) {
            const result = await get('/api/gifts/' + saved.id + '/' + key);
            assert.equal(result.status, 200);
            assert.equal(result.headers.get('cache-control'), 'no-store');
            assert.deepEqual(Buffer.from(await result.arrayBuffer()), Buffer.from(await original.arrayBuffer()));
          }
          console.log('PASS: published Worker stores and returns original certificate and audio');
          console.log('THAUMA_DEPLOYMENT_ORIGIN=' + base);
          JS
